[project]
name = "aiosplice"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["aiosplice"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
aiosplice = { workspace = true }

[dependency-groups]
dev = [
    "aiosplice",
]
